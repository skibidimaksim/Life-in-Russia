name: Build Life in Russia

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Prepare NeoForge
        run: |
          set -e
          curl -fL --retry 3 \
            https://github.com/NeoForgeMDKs/MDK-1.21.11-ModDevGradle/archive/refs/heads/main.zip \
            -o /tmp/mdk.zip
          unzip -q /tmp/mdk.zip -d /tmp/mdk
          BASE=/tmp/mdk/MDK-1.21.11-ModDevGradle-main
          cp "$BASE/build.gradle" .
          cp "$BASE/settings.gradle" .
          cp "$BASE/gradle.properties" .
          cp "$BASE/gradlew" .
          cp -R "$BASE/gradle" .
          mkdir -p src/main
          cp -R "$BASE/src/main/templates" src/main/
          sed -i \
            -e 's/^mod_id=.*/mod_id=lifeinrussia/' \
            -e 's/^mod_name=.*/mod_name=Life in Russia/' \
            -e 's/^mod_version=.*/mod_version=0.4.2/' \
            -e 's/^mod_group_id=.*/mod_group_id=com.cursedstudios.lifeinrussia/' \
            -e 's/^neo_version=.*/neo_version=21.11.45/' \
            gradle.properties
          chmod +x gradlew

      - name: Generate Java
        run: |
          mkdir -p src/main/java/com/cursedstudios/lifeinrussia
          cat > src/main/java/com/cursedstudios/lifeinrussia/LifeInRussia.java <<'JAVA'
          package com.cursedstudios.lifeinrussia;

          import com.mojang.brigadier.arguments.IntegerArgumentType;
          import net.minecraft.commands.Commands;
          import net.minecraft.network.chat.Component;
          import net.minecraft.server.level.ServerPlayer;
          import net.minecraft.world.SimpleContainer;
          import net.minecraft.world.SimpleMenuProvider;
          import net.minecraft.world.inventory.ChestMenu;
          import net.minecraft.world.item.Item;
          import net.minecraft.world.item.ItemStack;
          import net.minecraft.world.item.Items;
          import net.minecraft.core.component.DataComponents;
          import net.minecraft.nbt.CompoundTag;
          import net.neoforged.bus.api.IEventBus;
          import net.neoforged.fml.common.Mod;
          import net.neoforged.neoforge.common.NeoForge;
          import net.neoforged.neoforge.event.RegisterCommandsEvent;
          import net.neoforged.neoforge.event.tick.PlayerTickEvent;

          @Mod(LifeInRussia.ID)
          public class LifeInRussia {
              public static final String ID = "lifeinrussia";

              public LifeInRussia(IEventBus bus) {
                  NeoForge.EVENT_BUS.addListener(this::commands);
                  NeoForge.EVENT_BUS.addListener(this::tick);
              }

              private CompoundTag data(ServerPlayer p) {
                  return p.getPersistentData();
              }

              private int age(ServerPlayer p) {
                  return data(p).getIntOr("lir_age", 14);
              }

              private void msg(ServerPlayer p, String s) {
                  p.sendSystemMessage(Component.literal(
                      "[Life in Russia] " + s
                  ));
              }

              private void setAge(ServerPlayer p, int a) {
                  data(p).putInt("lir_age",
                      Math.max(14, Math.min(200, a)));
                  data(p).putInt("lir_ticks", 0);
              }

              private void add(SimpleContainer c, int slot,
                               Item item, String text) {
                  ItemStack stack = new ItemStack(item);
                  stack.set(DataComponents.CUSTOM_NAME,
                      Component.literal(text));
                  c.setItem(slot, stack);
              }

              private void phone(ServerPlayer p) {
                  SimpleContainer c = new SimpleContainer(27);

                  add(c, 10, Items.PAPER, "Госуслуги");
                  add(c, 11, Items.EMERALD, "Банк");
                  add(c, 12, Items.BARRIER, "Интернета нет, ты лох");
                  add(c, 13, Items.BOOK, "РКН");
                  add(c, 14, Items.IRON_PICKAXE, "Работа");
                  add(c, 15, Items.COMPARATOR, "Настройки");

                  p.openMenu(new SimpleMenuProvider(
                      (id, inv, player) ->
                          ChestMenu.threeRows(id, inv, c),
                      Component.literal("Россия OS")
                  ));
              }

              private void commands(RegisterCommandsEvent e) {
                  e.getDispatcher().register(
                      Commands.literal("life")
                      .then(Commands.literal("get").executes(ctx -> {
                          ServerPlayer p =
                              ctx.getSource().getPlayerOrException();
                          msg(p, "Возраст: " + age(p));
                          return 1;
                      }))
                      .then(Commands.literal("phone").executes(ctx -> {
                          phone(ctx.getSource().getPlayerOrException());
                          return 1;
                      }))
                      .then(Commands.literal("bank").executes(ctx -> {
                          ServerPlayer p =
                              ctx.getSource().getPlayerOrException();
                          msg(p, "Баланс: " +
                              data(p).getIntOr("lir_money", 0) + " ₽");
                          return 1;
                      }))
                      .then(Commands.literal("set")
                          .requires(s -> s.hasPermission(2))
                          .then(Commands.argument("age",
                              IntegerArgumentType.integer(14, 200))
                              .executes(ctx -> {
                                  ServerPlayer p =
                                      ctx.getSource()
                                      .getPlayerOrException();
                                  setAge(p, IntegerArgumentType
                                      .getInteger(ctx, "age"));
                                  msg(p, "Возраст: " + age(p));
                                  return 1;
                              })))
                      .then(Commands.literal("add")
                          .requires(s -> s.hasPermission(2))
                          .then(Commands.argument("years",
                              IntegerArgumentType.integer(1, 200))
                              .executes(ctx -> {
                                  ServerPlayer p =
                                      ctx.getSource()
                                      .getPlayerOrException();
                                  setAge(p, age(p) +
                                      IntegerArgumentType
                                      .getInteger(ctx, "years"));
                                  msg(p, "Возраст: " + age(p));
                                  return 1;
                              })))
                  );
              }

              private void tick(PlayerTickEvent.Post e) {
                  if (!(e.getEntity() instanceof ServerPlayer p))
                      return;

                  CompoundTag d = data(p);
                  int ticks = d.getIntOr("lir_ticks", 0) + 1;

                  if (ticks >= 12000) {
                      ticks = 0;
                      setAge(p, age(p) + 1);
                      msg(p, "С днём рождения! Тебе " +
                          age(p) + " лет.");
                  }

                  d.putInt("lir_ticks", ticks);
              }
          }
          JAVA

      - name: Compile
        run: ./gradlew build --no-daemon --stacktrace

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: Life-in-Russia-JAR
          path: build/libs/*.jar
          if-no-files-found: error
          
