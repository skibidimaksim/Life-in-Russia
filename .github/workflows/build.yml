name: Build Life in Russia
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Get official NeoForge MDK build files
        run: |
          curl -fsSL --retry 3 https://github.com/NeoForgeMDKs/MDK-1.21.11-ModDevGradle/archive/refs/heads/main.zip -o /tmp/neomdk.zip
          unzip -q /tmp/neomdk.zip -d /tmp/neomdk
          base=/tmp/neomdk/MDK-1.21.11-ModDevGradle-main
          cp "$base/build.gradle" "$base/settings.gradle" "$base/gradle.properties" "$base/gradlew" .
          cp -R "$base/gradle" .
          mkdir -p src/main/resources/META-INF
          cp -R "$base/src/main/templates" src/main/
          sed -i 's/^mod_id=.*/mod_id=lifeinrussia/; s/^mod_name=.*/mod_name=Life in Russia/; s/^mod_version=.*/mod_version=0.1.0/; s/^mod_group_id=.*/mod_group_id=com.cursedstudios.lifeinrussia/; s/^neo_version=.*/neo_version=21.11.45/' gradle.properties
          chmod +x gradlew
      - name: Create mod source automatically
        run: |
          mkdir -p src/main/java/com/cursedstudios/lifeinrussia
          echo '' | base64 -d > src/main/java/com/cursedstudios/lifeinrussia/LifeInRussia.java
      - name: Build mod
        run: ./gradlew build --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: Life-in-Russia-jar
          path: build/libs/*.jar
